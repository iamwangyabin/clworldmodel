[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clworldmodel"
version = "0.1.0"
description = "Continual world-model research components"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "torch==2.3.0",
]

[project.optional-dependencies]
atari = [
    "ale-py==0.11.1",
    "gymnasium==1.1.1",
    "gymnasium-notices==0.0.1",
    "tianshou==0.5.1",
    "numpy==1.26.4",
    "torchaudio==2.3.0",
    "torchvision==0.18.0",
    "opencv-python==4.11.0.86",
    "matplotlib==3.10.0",
    "tqdm==4.67.1",
    "sortedcontainers==2.4.0",
    "tensorboard==2.13.0",
    "tensorboard-data-server==0.7.2",
]
online = [
    "swanlab==0.9.4",
]
dinov3 = [
    "transformers==4.57.1",
    "safetensors==0.6.2",
]

[tool.setuptools.packages.find]
where = ["src"]
